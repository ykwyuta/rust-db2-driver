name: rust-db2-driver-validation
services:
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: DriverTest_2026!
      DBNAME: DRIVERDB
      BLU: "false"
      TO_CREATE_SAMPLEDB: "false"
      PERSISTENT_HOME: "false"
    ports:
      - "127.0.0.1:35000:50000"
      - "127.0.0.1:35001:50001"
